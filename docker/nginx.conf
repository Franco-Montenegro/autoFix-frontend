server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Configuración en tiempo de ejecución: nunca se cachea
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Archivos con hash en el nombre: caché larga (sin "always", para no cachear un 404)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: las rutas internas (ej. /vehicles) las resuelve React Router
    location / {
        try_files $uri /index.html;
    }
}
